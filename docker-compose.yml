# Servidor central DriveSafe AI.
#
#   docker compose up -d --build
#   docker compose exec servidor python manage.py criar-dispositivo --nome "Caminhão ABC-1234"
#
# Com Postgres no lugar do SQLite:
#   1. crie um arquivo .env com POSTGRES_PASSWORD=uma-senha-forte
#   2. descomente DATABASE_URL abaixo
#   3. docker compose --profile postgres up -d --build

name: drivesafe

services:
  servidor:
    build: .
    image: drivesafe-servidor
    ports:
      - "8000:8000"
    environment:
      DRIVESAFE_TIMEZONE: America/Sao_Paulo
      # DATABASE_URL: postgresql+psycopg://drivesafe:${POSTGRES_PASSWORD}@postgres:5432/drivesafe
    volumes:
      - dados:/app/data
    restart: unless-stopped

  postgres:
    image: postgres:18.6-alpine
    profiles: ["postgres"]
    environment:
      POSTGRES_DB: drivesafe
      POSTGRES_USER: drivesafe
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes:
      # A partir do Postgres 18 o volume vai em /var/lib/postgresql (não em .../data).
      - postgres:/var/lib/postgresql
    restart: unless-stopped

  # Agente de monitoramento, só em Linux com webcam em /dev/video0 (ex.: Raspberry Pi com Docker):
  #   DRIVESAFE_DEVICE_TOKEN=dsk_... docker compose --profile dispositivo up -d --build
  dispositivo:
    build:
      context: .
      dockerfile: Dockerfile.dispositivo
    image: drivesafe-dispositivo
    profiles: ["dispositivo"]
    devices:
      - /dev/video0:/dev/video0
      # Descomente para a sirene sair pela placa de som do host:
      # - /dev/snd:/dev/snd
    group_add:
      - video
      - audio
    environment:
      DRIVESAFE_SERVER_URL: ${DRIVESAFE_SERVER_URL:-http://servidor:8000}
      DRIVESAFE_DEVICE_TOKEN: ${DRIVESAFE_DEVICE_TOKEN:-}
      DRIVESAFE_CAMERA: "0"
      DRIVESAFE_CAMERA_IR: ${DRIVESAFE_CAMERA_IR:-auto}
      DRIVESAFE_DRIVER_KEY: ${DRIVESAFE_DRIVER_KEY:-padrao}
      DRIVESAFE_CONSENTIMENTO_PERFIL: ${DRIVESAFE_CONSENTIMENTO_PERFIL:-0}
      DRIVESAFE_SINAIS_ATIVACAO: ${DRIVESAFE_SINAIS_ATIVACAO:-local}
      DRIVESAFE_CELULAR: ${DRIVESAFE_CELULAR:-1}
    volumes:
      - dispositivo:/dados
    restart: unless-stopped

volumes:
  dados:
  postgres:
  dispositivo:
