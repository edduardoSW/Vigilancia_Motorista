# RotaGuard Teste (spec 010): empacota o script da caixa para Windows e Linux (sem Mac, decisão de 14/09/2026).
# Cada pacote passa pelos testes de fumaça e sem câmera antes de subir. Tag teste-vX.Y.Z publica a release.
name: App de teste do script

on:
  push:
    tags: ["teste-v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-teste-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pacote:
    name: Pacote ${{ matrix.nome }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            nome: windows
          - os: ubuntu-24.04
            nome: linux
    runs-on: ${{ matrix.os }}
    env:
      ROTAGUARD_VERSAO: ${{ github.ref_type == 'tag' && github.ref_name || '0.0.0-dev' }}
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Bibliotecas do sistema (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0 libegl1

      - name: Dependências
        run: python -m pip install -r caixa/requirements.txt pyinstaller==6.22.3

      - name: Testes do app de teste (spec 010)
        run: python tests/test_app_teste.py

      - name: PyInstaller, teste de fumaça e pacotes
        run: python implantacao/app-teste/build.py

      - uses: actions/upload-artifact@v7
        with:
          name: rotaguard-teste-${{ matrix.nome }}
          path: build/app-teste/pacotes/*
          if-no-files-found: error

  release:
    name: Release
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'teste-v')
    needs: pacote
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: pacotes
          merge-multiple: true

      - name: SHA256SUMS
        run: cd pacotes && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v3
        with:
          name: RotaGuard Teste ${{ github.ref_name }}
          files: pacotes/*
          make_latest: "true"
          body: |
            App de teste do script do RotaGuard: roda a detecção de sono e de uso de celular com a câmera do computador, com alarme sonoro e sem servidor.

            - Windows 10/11 64 bits: `RotaGuard-Teste-windows-x64-setup.exe` (ou o `.zip` portátil).
            - Linux x86_64: `RotaGuard-Teste-linux-x86_64.tar.gz`.

            Versão de teste sem assinatura digital: o Windows pode pedir confirmação na primeira abertura. Privacidade, LGPD e termos ficam na seção do próprio app. Protótipo em validação; não é diagnóstico.
